<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fafafa">
  <title>ColorFulCraft | 历史博物馆</title>
  <link rel="icon" type="image/x-icon" href="pictures/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="pictures/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="pictures/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="pictures/apple-touch-icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --surface-2: #f5f5f5;
      --text: #0a0a0a;
      --text-secondary: #737373;
      --text-tertiary: #a3a3a3;
      --border: #e5e5e5;
      --border-strong: #d4d4d4;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --radius-sm: 8px;
      --radius: 10px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
      --shadow-md: 0 4px 16px rgba(0,0,0,.08);
      --shadow-lg: 0 16px 48px rgba(0,0,0,.12);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --transition: .2s cubic-bezier(.4,0,.2,1);
    }

    body.dark-mode {
      --bg: #0a0a0a;
      --surface: #151515;
      --surface-2: #1f1f1f;
      --text: #fafafa;
      --text-secondary: #a3a3a3;
      --text-tertiary: #737373;
      --border: #262626;
      --border-strong: #404040;
      --accent: #818cf8;
      --accent-hover: #a5b4fc;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
      --shadow-md: 0 4px 16px rgba(0,0,0,.5);
      --shadow-lg: 0 16px 48px rgba(0,0,0,.6);
    }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color var(--transition), color var(--transition);
    }

    a { color: inherit; }

    /* ============ Header ============ */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 32px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      transition: background-color var(--transition), border-color var(--transition);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: .95rem;
      letter-spacing: -.01em;
      text-decoration: none;
      color: var(--text);
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e84f9b, #8b5cf6, #1d9fd7);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
    }

    .icon-btn:hover {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border);
    }

    .icon-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .icon-btn svg { width: 18px; height: 18px; }
    .icon-moon { display: none; }
    body.dark-mode .icon-sun { display: none; }
    body.dark-mode .icon-moon { display: block; }

    /* ============ Hero ============ */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 96px 24px 80px;
      max-width: 820px;
      margin: 0 auto;
      width: 100%;
    }

    .hero h1 {
      display: flex;
      flex-direction: column;
      gap: 16px;
      line-height: 1.05;
      letter-spacing: -.03em;
    }

    .hero h1 span {
      font-size: clamp(2.75rem, 7vw, 5rem);
      font-weight: 700;
      background: linear-gradient(135deg, #e84f9b 0%, #8b5cf6 50%, #1d9fd7 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero h1 small {
      font-size: clamp(1rem, 2vw, 1.25rem);
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: .02em;
    }

    .hero-subtitle {
      margin-top: 28px;
      max-width: 560px;
      font-size: clamp(1rem, 1.5vw, 1.125rem);
      color: var(--text-secondary);
      line-height: 1.75;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 22px;
      font-family: inherit;
      font-size: .9rem;
      font-weight: 500;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      text-decoration: none;
      transition: all var(--transition);
      white-space: nowrap;
    }

    .btn:hover {
      border-color: var(--border-strong);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .btn-primary {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .btn-primary:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ============ Footer ============ */
    .site-footer {
      border-top: 1px solid var(--border);
      padding: 32px 24px;
      transition: border-color var(--transition);
    }

    .footer-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .contributors {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0;
      min-height: 32px;
    }

    .contributors-label {
      font-size: .8rem;
      color: var(--text-tertiary);
      margin-right: 10px;
    }

    .contributor-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      border: 2px solid var(--bg);
      box-shadow: 0 0 0 1px var(--border);
      cursor: pointer;
      position: relative;
      margin-left: -8px;
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .contributor-avatar:first-of-type { margin-left: 0; }

    .contributor-avatar:hover {
      transform: translateY(-3px) scale(1.08);
      z-index: 10;
      box-shadow: 0 0 0 1px var(--border), var(--shadow-sm);
    }

    .contributor-tooltip {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      background: var(--text);
      color: var(--bg);
      font-size: .78rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      z-index: 20;
    }

    .contributor-avatar:hover .contributor-tooltip {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .contributor-name { font-weight: 600; margin-bottom: 2px; }
    .contributor-stats { opacity: .7; font-size: .72rem; }

    .github-stars {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      font-size: .85rem;
      transition: all var(--transition);
    }

    .github-stars:hover {
      border-color: var(--border-strong);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .github-stars > svg { width: 16px; height: 16px; }
    .repo-name { font-weight: 500; }

    .stars-count {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      font-size: .8rem;
      color: var(--text-secondary);
    }

    .stars-count svg { width: 12px; height: 12px; }

    .footer-note {
      font-size: .82rem;
      color: var(--text-tertiary);
      text-align: center;
    }

    .footer-note a {
      color: var(--text-secondary);
      text-decoration: none;
      border-bottom: 1px solid var(--border-strong);
      transition: color var(--transition), border-color var(--transition);
    }

    .footer-note a:hover {
      color: var(--text);
      border-color: var(--text);
    }

    /* ============ Stats Toast ============ */
    .stats-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      font-size: .85rem;
      color: var(--text-secondary);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease, transform .3s ease;
      max-width: calc(100vw - 32px);
    }

    .stats-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .stats-greeting { font-weight: 500; color: var(--text); }
    .stats-divider { width: 1px; height: 14px; background: var(--border); }
    .stats-item { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .stats-item strong { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

    /* ============ Drawers (Wiki / Comments) ============ */
    .drawer {
      position: fixed;
      top: 0;
      height: 100vh;
      width: 340px;
      max-width: 90vw;
      background: var(--surface);
      transform: translateX(var(--drawer-x));
      transition: transform .35s cubic-bezier(.4,0,.2,1);
      z-index: 200;
      display: flex;
      flex-direction: column;
    }

    .wiki-sidebar {
      --drawer-x: -100%;
      left: 0;
      border-right: 1px solid var(--border);
      box-shadow: 16px 0 48px rgba(0,0,0,.08);
    }

    .wiki-sidebar.active { transform: translateX(0); }

    .comments-section {
      --drawer-x: 100%;
      right: 0;
      width: 420px;
      border-left: 1px solid var(--border);
      box-shadow: -16px 0 48px rgba(0,0,0,.08);
    }

    .comments-section.active { transform: translateX(0); }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .drawer-title {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -.01em;
    }

    .drawer-close {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
    }

    .drawer-close:hover {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border);
    }

    .drawer-close:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .wiki-links {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .wiki-link {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      color: var(--text);
      text-decoration: none;
      font-size: .9rem;
      transition: background var(--transition);
      gap: 8px;
    }

    .wiki-link::after {
      content: '→';
      color: var(--text-tertiary);
      font-size: .85rem;
      transition: transform var(--transition), color var(--transition);
      flex-shrink: 0;
    }

    .wiki-link:hover { background: var(--surface-2); }
    .wiki-link:hover::after { color: var(--text); transform: translateX(3px); }
    .wiki-link:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    .comments-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .comments-loading {
      padding: 24px;
      text-align: center;
      color: var(--text-tertiary);
      font-size: .88rem;
    }

    .comments-error {
      padding: 24px;
      text-align: center;
      font-size: .88rem;
      color: var(--text-secondary);
    }

    .comments-error strong { color: var(--text); display: block; margin-bottom: 8px; }

    .comments-error .comment-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .comment-action-btn {
      padding: 8px 16px;
      font-family: inherit;
      font-size: .85rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: all var(--transition);
    }

    .comment-action-btn:hover {
      border-color: var(--border-strong);
      background: var(--surface-2);
    }

    .comment-action-btn.primary {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .comment-action-btn.primary:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ============ Emoji feedback ============ */
    .emoji-feedback {
      position: fixed;
      font-size: 22px;
      pointer-events: none;
      z-index: 300;
      animation: emojiRise 1.2s ease-out forwards;
      user-select: none;
    }

    @keyframes emojiRise {
      0%   { transform: translateY(0) scale(.8); opacity: 1; }
      100% { transform: translateY(-60px) scale(1.1); opacity: 0; }
    }

    /* ============ Modal / Notification ============ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      animation: fadeIn .25s ease;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      animation: modalIn .3s cubic-bezier(.34,1.56,.64,1);
    }

    .modal h2 {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 20px;
      letter-spacing: -.01em;
    }

    .modal-body {
      color: var(--text-secondary);
      font-size: .92rem;
      line-height: 1.75;
      margin-bottom: 24px;
    }

    .modal-body p { margin-bottom: 10px; }
    .modal-body strong { color: var(--text); }

    .modal-body a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .modal-body a:hover { text-decoration: underline; }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .modal-btn {
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: .9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }

    .modal-btn:hover { background: var(--surface-2); }

    .modal-btn-primary {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .modal-btn-primary:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(.96) translateY(8px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .notification {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      padding: 12px 20px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: .88rem;
      z-index: 1001;
      opacity: 0;
      animation: notificationIn .3s ease forwards, notificationOut .3s ease 2.7s forwards;
    }

    .notification-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #22c55e;
      color: #fff;
      font-size: .8rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .notification-title { font-weight: 500; color: var(--text); }
    .notification-desc { font-size: .78rem; color: var(--text-tertiary); }

    @keyframes notificationIn {
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    @keyframes notificationOut {
      to { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }

    /* ============ Responsive ============ */
    @media (max-width: 640px) {
      .site-header { padding: 12px 16px; }
      .hero { padding: 56px 20px 48px; }
      .actions { flex-direction: column; width: 100%; max-width: 300px; }
      .btn { width: 100%; }
      .drawer { width: 100%; max-width: 100%; }
      .stats-toast { bottom: 16px; font-size: .8rem; padding: 8px 14px; gap: 10px; }
      .footer-inner { gap: 16px; }
      .github-stars { flex-wrap: wrap; justify-content: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="#" class="brand">
      <span class="brand-dot"></span>
      <span>ColorFulCraft</span>
    </a>
    <div class="header-actions">
      <button class="icon-btn" id="sidebarToggle" aria-label="打开技术 Wiki" title="技术 Wiki">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </button>
      <button class="icon-btn" id="commentsToggle" aria-label="打开留言小屋" title="留言小屋">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </button>
      <button class="icon-btn" id="themeToggle" aria-label="切换深色模式" title="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="hero">
    <h1>
      <span>ColorFulCraft</span>
      <small>历史博物馆</small>
    </h1>
    <p class="hero-subtitle">把服务器故事、图片、音乐、视频与技术文档收进一座可爱的小小方块博物馆。</p>
    <div class="actions">
      <a class="btn btn-primary" href="https://github.com/ColorFulCraft/CFCHistory" target="_blank" rel="noopener noreferrer">
        GitHub 仓库
      </a>
      <a class="btn" href="https://qm.qq.com/q/L8kNa8IJqu" target="_blank" rel="noopener noreferrer">
        加入我们
      </a>
      <a class="btn" href="documentation.html">
        查看文档
      </a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="contributors" id="contributorsContainer"></div>
      <a class="github-stars" href="https://github.com/ColorFulCraft/CFCHistory" target="_blank" rel="noopener noreferrer">
        <svg fill="currentColor" viewBox="0 0 24 24">

  <!-- 访问统计 toast -->
  <div class="stats-toast" id="statsPanel" role="status" aria-live="polite">
    <span class="stats-greeting" id="greetingText">你好</span>
    <span class="stats-divider"></span>

    <span class="stats-item">累计 <strong id="totalCount">0</strong></span>

  <aside class="drawer wiki-sidebar" id="wikiSidebar" aria-label="技术 Wiki">

      <button class="drawer-close" id="wikiClose" aria-label="关闭">×</button>
    </div>
    <div class="wiki-links" id="wikiLinks"></div>

    <div class="drawer-header">
      <span class="drawer-title">留言小屋</span>
      <button class="drawer-close" id="commentsClose" aria-label="关闭">×</button>
    </div>
    <div class="comments-container" id="commentsContainer"></div>
  </section>

<script>
/* ============================================================
   工具函数
   ============================================================ */
function getGreeting() {
  const hour = new Date().getHours();
  if (hour >= 5 && hour < 12) return '早上好';
  if (hour >= 12 && hour < 14) return '中午好';
  if (hour >= 14 && hour < 18) return '下午好';
  if (hour >= 18 && hour < 22) return '晚上好';
  return '夜深了';
}

function formatDate(dateString) {
  const date = new Date(dateString);
  if (isNaN(date.getTime())) return '—';
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
}

/* ============================================================
   主题
   ============================================================ */
const themeToggle = document.getElementById('themeToggle');
const body = document.body;
const themeMeta = document.querySelector('meta[name="theme-color"]');

if (localStorage.getItem('theme') === 'dark') {
  body.classList.add('dark-mode');
}
updateThemeMeta();

themeToggle.addEventListener('click', () => {
  body.classList.toggle('dark-mode');
  localStorage.setItem('theme', body.classList.contains('dark-mode') ? 'dark' : 'light');
  updateThemeMeta();
  updateUtterancesTheme();
  syncThemeToDocumentationPage();
});

function updateThemeMeta() {
  if (themeMeta) {
    themeMeta.setAttribute('content', body.classList.contains('dark-mode') ? '#0a0a0a' : '#fafafa');
  }
}

function syncThemeToDocumentationPage() {
  const themeEvent = {
    type: 'theme-change',
    theme: body.classList.contains('dark-mode') ? 'dark' : 'light',
    timestamp: Date.now()
  };
  localStorage.setItem('cfc-theme-sync', JSON.stringify(themeEvent));
  setTimeout(() => localStorage.removeItem('cfc-theme-sync'), 3000);
}

window.addEventListener('load', () => {
  const lastThemeSync = localStorage.getItem('last-docs-theme');
  if (lastThemeSync) {
    try {
      const themeData = JSON.parse(lastThemeSync);
      const currentTheme = localStorage.getItem('theme');
      if (themeData.theme !== currentTheme) {
        if (themeData.theme === 'dark') {
          body.classList.add('dark-mode');
          localStorage.setItem('theme', 'dark');
        } else {
          body.classList.remove('dark-mode');
          localStorage.setItem('theme', 'light');
        }
        updateThemeMeta();
      }
    } catch (e) { /* ignore */ }
    localStorage.removeItem('last-docs-theme');
  }
});

window.addEventListener('storage', (e) => {
  if (e.key === 'docs-theme-update') {
    try {
      const themeData = JSON.parse(e.newValue);
      if (themeData && themeData.theme) {
        if (themeData.theme === 'dark' && !body.classList.contains('dark-mode')) {
          body.classList.add('dark-mode');
          localStorage.setItem('theme', 'dark');
        } else if (themeData.theme === 'light' && body.classList.contains('dark-mode')) {
          body.classList.remove('dark-mode');
          localStorage.setItem('theme', 'light');
        }
        updateThemeMeta();
      }
    } catch (e) { /* ignore */ }
  }
});

/* ============================================================
   访问统计
   ============================================================ */
let statsPanelTimer = null;

async function updateVisitStats() {
  try {
    const greetingText = document.getElementById('greetingText');
    if (greetingText) greetingText.textContent = getGreeting();
    await fetchAndDisplayRealStats();
  } catch (error) {
    console.error('更新访问统计失败:', error);
  } finally {
    showStatsPanel();
  }
}

async function fetchAndDisplayRealStats() {
  try {
    const url = 'https://colorfulcraft.github.io/CFCHistory/stats/visit_stats.json?t=' + Date.now();
    const response = await fetch(url);
    if (!response.ok) return;
    const content = await response.json();

    const today = new Date().toISOString().split('T')[0];
    let todayVisits = 0;
    if (content.hourly_visits) {
      Object.entries(content.hourly_visits).forEach(([hourKey, count]) => {
        if (hourKey.startsWith(today)) todayVisits += count;
      });
    }
    updateStatsDisplay(todayVisits, content.total_visits || 0);
  } catch (error) {
    updateStatsDisplay(0, 0);
  }
}

function updateStatsDisplay(todayCount, totalCount) {
  const todayEl = document.getElementById('todayCount');
  const totalEl = document.getElementById('totalCount');
  if (todayEl) todayEl.textContent = todayCount.toString();
  if (totalEl) totalEl.textContent = totalCount.toString();
}

function showStatsPanel() {
  if (localStorage.getItem('statsPanelClosed') === 'true') return;
  const panel = document.getElementById('statsPanel');
  if (!panel) return;
  panel.classList.add('show');
  startAutoHideTimer();
}

function hideStatsPanel() {
  const panel = document.getElementById('statsPanel');
  if (!panel) return;
  if (statsPanelTimer) {
    clearTimeout(statsPanelTimer);
    statsPanelTimer = null;
  }
  panel.classList.remove('show');
  setTimeout(() => {
    localStorage.setItem('statsPanelClosed', 'true');
  }, 400);
}

function startAutoHideTimer() {
  if (statsPanelTimer) clearTimeout(statsPanelTimer);
  statsPanelTimer = setTimeout(hideStatsPanel, 3000);
}

function setupStatsPanel() {
  const panel = document.getElementById('statsPanel');
  if (!panel) return;
  panel.addEventListener('mouseenter', () => {
    if (statsPanelTimer) {
      clearTimeout(statsPanelTimer);
      statsPanelTimer = null;
    }
  });
  panel.addEventListener('mouseleave', startAutoHideTimer);
  panel.addEventListener('click', hideStatsPanel);
}

/* ============================================================
   Wiki 抽屉
   ============================================================ */
const wikiLinks = [
  { text: "官网", url: "https://blog.xhil.cn/" },
  { text: "音乐", url: "https://github.com/ColorFulCraft/CFCHistory/blob/main/music/readme.md" },
  { text: "图片", url: "https://github.com/ColorFulCraft/CFCHistory/blob/main/pictures/readme.md" },
  { text: "视频", url: "https://github.com/ColorFulCraft/CFCHistory/blob/main/videos/README.md" },
  { text: "旧文件", url: "https://github.com/ColorFulCraft/CFCHistory/blob/main/old%20files/README.md" },
  { text: "更新日志", url: "https://github.com/ColorFulCraft/CFCHistory/tree/main/update-log" },
  { text: "查看服务器团队及其现状", url: "https://github.com/ColorFulCraft/CFCHistory/blob/main/docs/about.md" },
  { text: "服务器历史大事记目录", url: "https://github.com/ColorFulCraft/CFCHistory/blob/main/docs/Directory.md" }
];

function renderWikiLinks() {
  const container = document.getElementById('wikiLinks');
  if (!container) return;
  container.innerHTML = '';
  const sorted = [...wikiLinks].sort((a, b) => a.text.length - b.text.length);
  sorted.forEach(link => {
    const el = document.createElement('a');
    el.href = link.url;
    el.className = 'wiki-link';
    el.target = '_blank';
    el.rel = 'noopener noreferrer';
    el.textContent = link.text;
    container.appendChild(el);
  });
}

const wikiSidebar = document.getElementById('wikiSidebar');
const sidebarToggle = document.getElementById('sidebarToggle');
const wikiClose = document.getElementById('wikiClose');
const commentsSection = document.getElementById('commentsSection');
const commentsToggle = document.getElementById('commentsToggle');
const commentsClose = document.getElementById('commentsClose');
const commentsContainer = document.getElementById('commentsContainer');

function openWiki() {
  wikiSidebar.classList.add('active');
  commentsSection.classList.remove('active');
}

function closeWiki() {
  wikiSidebar.classList.remove('active');
}

sidebarToggle.addEventListener('click', () => {
  wikiSidebar.classList.contains('active') ? closeWiki() : openWiki();
});

wikiClose.addEventListener('click', closeWiki);

document.addEventListener('click', (e) => {
  if (wikiSidebar.classList.contains('active') &&
      !wikiSidebar.contains(e.target) &&
      !sidebarToggle.contains(e.target)) {
    closeWiki();
  }
  if (commentsSection.classList.contains('active') &&
      !commentsSection.contains(e.target) &&
      !commentsToggle.contains(e.target)) {
    commentsSection.classList.remove('active');
  }
});

/* ============================================================
   GitHub Stars
   ============================================================ */
async function fetchGitHubStars() {
  const el = document.getElementById('starsCount');
  if (!el) return;
  try {
    const response = await fetch('https://api.github.com/repos/ColorFulCraft/CFCHistory');
    const data = await response.json();
    if (data.stargazers_count !== undefined) {
      el.textContent = `${data.stargazers_count} Stars`;
    } else {
      el.textContent = 'N/A';
    }
  } catch (error) {
    console.error('获取 GitHub Stars 失败:', error);
    el.textContent = '获取失败';
  }
}

/* ============================================================
   贡献者
   ============================================================ */
let contributors = [];

async function fetchContributors() {
  const cached = localStorage.getItem('cfc_contributors');
  const timestamp = localStorage.getItem('cfc_contributors_timestamp');
  if (cached && timestamp && (Date.now() - parseInt(timestamp, 10)) < 3600000) {
    try {
      contributors = JSON.parse(cached);
      createContributorAvatars();
      return;
    } catch (e) { /* fallthrough */ }
  }

  try {
    const response = await fetch('https://api.github.com/repos/ColorFulCraft/CFCHistory/contributors');
    if (!response.ok) throw new Error('获取贡献者失败');
    const data = await response.json();

    contributors = await Promise.all(data.map(async c => {
      try {
        const r = await fetch(c.url);
        if (!r.ok) throw new Error();
        const d = await r.json();
        return {
          id: c.id, login: c.login, avatar_url: c.avatar_url,
          html_url: c.html_url, contributions: c.contributions,
          updated_at: d.updated_at || new Date().toISOString()
        };
      } catch {
        return {
          id: c.id, login: c.login, avatar_url: c.avatar_url,
          html_url: c.html_url, contributions: c.contributions,
          updated_at: new Date().toISOString()
        };
      }
    }));

    localStorage.setItem('cfc_contributors', JSON.stringify(contributors));
    localStorage.setItem('cfc_contributors_timestamp', Date.now().toString());
    createContributorAvatars();
  } catch (error) {
    console.error('获取贡献者出错:', error);
    if (cached) {
      try {
        contributors = JSON.parse(cached);
        createContributorAvatars();
      } catch (e) { /* ignore */ }
    }
  }
}

function createContributorAvatars() {
  const container = document.getElementById('contributorsContainer');
  if (!container) return;
  container.innerHTML = '';
  if (!contributors.length) return;

  const label = document.createElement('span');
  label.className = 'contributors-label';
  label.textContent = '贡献者';
  container.appendChild(label);

  contributors.forEach(c => {
    const avatar = document.createElement('div');
    avatar.className = 'contributor-avatar';
    avatar.style.backgroundImage = `url(${c.avatar_url})`;
    avatar.setAttribute('role', 'button');
    avatar.setAttribute('tabindex', '0');
    avatar.setAttribute('aria-label', `${c.login}，${c.contributions} 次贡献`);

    const tooltip = document.createElement('div');
    tooltip.className = 'contributor-tooltip';
    tooltip.innerHTML = `<div class="contributor-name">${c.login}</div>
                         <div class="contributor-stats">${c.contributions} 次贡献 · ${formatDate(c.updated_at)}</div>`;
    avatar.appendChild(tooltip);

    const open = () => window.open(c.html_url, '_blank', 'noopener');
    avatar.addEventListener('click', open);
    avatar.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); }
    });

    container.appendChild(avatar);
  });
}

/* ============================================================
   Emoji 点击反馈
   ============================================================ */
function createEmojiFeedback(e) {
  if (e.target.closest('button, a, input, textarea, [role="button"]')) return;
  const emojis = ['✨', '⭐', '🌟', '💫', '💖', '🎉', '😊', '🤩', '🎊', '🍪', '🧱', '🌸', '🍀', '🐾'];
  const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];

  const el = document.createElement('div');
  el.className = 'emoji-feedback';
  el.textContent = randomEmoji;
  el.style.left = `${e.clientX - 12}px`;
  el.style.top = `${e.clientY - 12}px`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1300);
}

/* ============================================================
   免责声明
   ============================================================ */
function showDisclaimer() {
  if (localStorage.getItem('disclaimerAccepted') === 'true') return;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.setAttribute('role', 'dialog');
  modal.setAttribute('aria-modal', 'true');
  modal.innerHTML = `
    <h2>免责声明</h2>
    <div class="modal-body">
      <p>欢迎访问 <strong>ColorFulCraft 历史博物馆</strong>！</p>
      <p>本网站仅作为技术 Wiki 和内容展示使用，所有内容仅供学习和参考。</p>
      <p><strong>ColorFulCraft 保留解释权利。</strong></p>
      <p>请仔细阅读我们的<a href="https://github.com/ColorFulCraft/CFCHistory/blob/main/LICENSE.md" target="_blank" rel="noopener noreferrer">许可证文件</a>。</p>
      <p style="margin-top: 16px; font-size: .82rem; color: var(--text-tertiary);">
        点击「我同意」即表示您已阅读、理解并同意遵守上述许可证的所有条款和条件。
      </p>
    </div>
    <div class="modal-actions">
      <button class="modal-btn" id="disagreeBtn" type="button">我不同意</button>
      <button class="modal-btn modal-btn-primary" id="agreeBtn" type="button">我同意</button>
    </div>
  `;

  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  document.getElementById('agreeBtn').addEventListener('click', () => {
    localStorage.setItem('disclaimerAccepted', 'true');
    localStorage.setItem('agreementVersion', '2025.10.19');
    localStorage.setItem('agreementDate', new Date().toISOString());
    overlay.remove();
    showAgreementConfirmation();
    startPageAnimations();
    updateVisitStats();
  });

  document.getElementById('disagreeBtn').addEventListener('click', () => {
    if (document.referrer) {
      window.history.back();
    } else {
      window.close() || (window.location.href = 'about:blank');
    }
  });
}

function showAgreementConfirmation() {
  const notif = document.createElement('div');
  notif.className = 'notification';
  notif.innerHTML = `
    <span class="notification-icon">✓</span>
    <div>
      <div class="notification-title">确认成功</div>
      <div class="notification-desc">你已阅读并确认免责声明 [2025.10.19 版]</div>
    </div>
  `;
  document.body.appendChild(notif);
  setTimeout(() => notif.remove(), 3200);
}

function startPageAnimations() {
  /* 预留：页面初始化动画 */
}

/* ============================================================
   评论系统（Utterances）
   ============================================================ */
const UTTERANCES_REPO = 'ColorFulCraft/CFCHistory';
const UTTERANCES_TERM = '💬 CFCHistory - 评论专区';
const UTTERANCES_LABEL = 'comments';

async function checkCommentsIssue() {
  try {
    const response = await fetch(`https://api.github.com/repos/${UTTERANCES_REPO}/issues?labels=${UTTERANCES_LABEL}`);
    if (!response.ok) return false;
    const issues = await response.json();
    return issues.length > 0;
  } catch (error) {
    return false;
  }
}

function showIssueCreationGuide() {
  commentsContainer.innerHTML = `
    <div class="comments-error">
      <strong>需要创建评论专用 Issue</strong>
      评论系统需要一个专用的 GitHub Issue 来存储所有评论。
      <div class="comment-actions">
        <a class="comment-action-btn primary"
           href="https://github.com/ColorFulCraft/CFCHistory/issues/new?title=💬%20CFCHistory%20-%20评论专区&body=欢迎来到ColorFulCraft历史博物馆的评论专区！在这里分享你的想法和建议吧！&labels=comments"
           target="_blank" rel="noopener noreferrer">创建评论 Issue</a>
        <button class="comment-action-btn" onclick="location.reload()">刷新页面</button>
      </div>
    </div>
  `;
}

function updateUtterancesTheme() {
  const iframe = commentsContainer.querySelector('iframe');
  if (iframe) {
    commentsContainer.innerHTML = '';
    initUtterances();
  }
}

async function initUtterances() {
  const hasIssue = await checkCommentsIssue();
  if (!hasIssue) {
    showIssueCreationGuide();
    return;
  }

  commentsContainer.innerHTML = '<div class="comments-loading">正在加载评论…</div>';

  const script = document.createElement('script');
  script.src = 'https://utteranc.es/client.js';
  script.setAttribute('repo', UTTERANCES_REPO);
  script.setAttribute('issue-term', UTTERANCES_TERM);
  script.setAttribute('label', UTTERANCES_LABEL);
  script.setAttribute('theme', body.classList.contains('dark-mode') ? 'github-dark' : 'github-light');
  script.setAttribute('crossorigin', 'anonymous');
  script.async = true;

  script.onerror = () => {
    commentsContainer.innerHTML = `
      <div class="comments-error">
        <strong>评论系统加载失败</strong>
        请检查 GitHub 仓库是否公开、Utterances 应用是否已安装，以及是否存在带 "comments" 标签的 Issue。
        <div class="comment-actions">
          <button class="comment-action-btn" onclick="initUtterances()">重试</button>
          <button class="comment-action-btn primary" onclick="location.reload()">刷新页面</button>
        </div>
      </div>
    `;
  };

  commentsContainer.appendChild(script);

  const successTimer = setTimeout(() => {
    const iframe = commentsContainer.querySelector('iframe');
    if (!iframe) {
      commentsContainer.innerHTML = `
        <div class="comments-error">
          <strong>评论系统加载超时</strong>
          请刷新页面重试。
          <div class="comment-actions">
            <button class="comment-action-btn primary" onclick="location.reload()">刷新页面</button>
          </div>
        </div>
      `;
    } else {
      const loading = commentsContainer.querySelector('.comments-loading');
      if (loading) loading.remove();
    }
  }, 8000);
}

commentsToggle.addEventListener('click', async () => {
  const isOpen = commentsSection.classList.toggle('active');
  if (isOpen) {
    wikiSidebar.classList.remove('active');
    if (commentsContainer.children.length === 0) {
      await initUtterances();
    }
  }
});

commentsClose.addEventListener('click', () => {
  commentsSection.classList.remove('active');
});

/* ============================================================
   初始化
   ============================================================ */
window.addEventListener('DOMContentLoaded', () => {
  // 问候语先行显示
  const greetingText = document.getElementById('greetingText');
  if (greetingText) greetingText.textContent = getGreeting();

  setupStatsPanel();
  renderWikiLinks();
  fetchGitHubStars();
  fetchContributors();

  // 交互：emoji 反馈 + 禁止选择/复制/右键菜单（与原页面行为一致）
  document.addEventListener('click', createEmojiFeedback);
  document.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    createEmojiFeedback(e);
  });
  document.addEventListener('selectstart', (e) => e.preventDefault());
  document.addEventListener('copy', (e) => e.preventDefault());

  // 免责声明 → 同意后加载统计
  if (localStorage.getItem('disclaimerAccepted') === 'true') {
    startPageAnimations();
    updateVisitStats();
  } else {
    showDisclaimer();
  }
});
</script>

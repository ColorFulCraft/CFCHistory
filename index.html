            <style>
:root {
    --pink: #e84f9b;
    --blue: #1d9fd7;
    --green: #4f9a35;
    --purple: #8b5cf6;
    --cream: #fff8dc;
    --ink: #28324a;
    --muted: #6b7280;
    --panel: rgba(255, 252, 245, 0.84);
    --panel-strong: rgba(255, 255, 255, 0.94);
    --line: rgba(70, 44, 94, 0.16);
    --shadow: rgba(85, 54, 120, 0.18);
    --pixel-shadow: 0 8px 0 rgba(82, 57, 107, 0.18), 0 18px 42px rgba(87, 66, 126, 0.22);
    --grass: #7ec850;
    --dirt: #a06d3f;
    --stone: #cfd7e6;
    --radius: 24px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    font-family: "Nunito", "M PLUS Rounded 1c", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    background: #fff4cf;
    cursor: default;
    isolation: isolate;
    transition: background 0.45s ease, color 0.45s ease;
}

body::before,
body::after {
    content: '';
    position: fixed;
    left: 0;
    width: 100%;
    pointer-events: none;
}

body::before {
    inset: 0;
    z-index: -3;
    background-image:
        linear-gradient(rgba(255,255,255,0.38) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.38) 1px, transparent 1px);
    background-size: 34px 34px;
    mask-image: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent 70%);
}

body::after {
    bottom: 0;
    height: 118px;
    z-index: -2;
    background:
        linear-gradient(90deg, rgba(255,255,255,0.22) 0 12px, transparent 12px 24px) 0 0 / 48px 18px,
        linear-gradient(#7ec850 0 22px, #6ab33f 22px 34px, #a06d3f 34px 72px, #81512d 72px 118px);
    box-shadow: inset 0 12px 0 rgba(255,255,255,0.18);
}

body.dark-mode {
    --panel: rgba(31, 28, 54, 0.82);
    --panel-strong: rgba(39, 35, 68, 0.94);
    --line: rgba(255, 255, 255, 0.16);
    --ink: #f7f1ff;
    --muted: #c9c3df;
    --shadow: rgba(0, 0, 0, 0.36);
    background: #15152c;
    color: var(--ink);
}

body.dark-mode::before {
    background-image:
        linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px);
}

body.dark-mode::after {
    background:
        linear-gradient(90deg, rgba(255,255,255,0.08) 0 12px, transparent 12px 24px) 0 0 / 48px 18px,
        linear-gradient(#355d37 0 22px, #27482b 22px 34px, #5c3a26 34px 72px, #38271f 72px 118px);
}

.gradient-bg {
    position: fixed;
    inset: 0;
    z-index: -4;
    background:
        radial-gradient(circle at 16% 20%, rgba(255, 122, 182, 0.36), transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(85, 214, 255, 0.34), transparent 30%),
        radial-gradient(circle at 62% 74%, rgba(137, 230, 133, 0.28), transparent 32%),
        linear-gradient(135deg, #ffe8f3 0%, #e6f8ff 46%, #fff7d1 100%);
    background-size: 140% 140%;
    animation: dreamySky 16s ease-in-out infinite alternate;
    transition: filter 0.45s ease, opacity 0.45s ease;
}

body.dark-mode .gradient-bg {
    filter: brightness(0.62) saturate(1.25) hue-rotate(28deg);
}

@keyframes dreamySky {
    0% { background-position: 0% 45%; }
    100% { background-position: 100% 55%; }
}

.cloud {
    position: fixed;
    left: -260px;
    width: 138px;
    height: 42px;
    z-index: -1;
    opacity: 0.76;
    background: rgba(255, 255, 255, 0.78);
    border: 3px solid rgba(255, 255, 255, 0.8);
    border-radius: 14px;
    box-shadow:
        28px -20px 0 2px rgba(255,255,255,0.78),
        72px -14px 0 10px rgba(255,255,255,0.78),
        108px -5px 0 0 rgba(255,255,255,0.78),
        0 12px 24px rgba(120, 150, 190, 0.12);
    image-rendering: pixelated;
    animation: cloudMove 38s linear infinite;
}

body.dark-mode .cloud {
    background: rgba(197, 202, 255, 0.28);
    border-color: rgba(236, 232, 255, 0.22);
    box-shadow:
        28px -20px 0 2px rgba(197, 202, 255, 0.28),
        72px -14px 0 10px rgba(197, 202, 255, 0.28),
        108px -5px 0 0 rgba(197, 202, 255, 0.28),
        0 12px 24px rgba(0, 0, 0, 0.2);
}

body > .cloud:nth-of-type(4) { top: 18%; animation-duration: 34s; animation-delay: -5s; transform: scale(0.86); }
body > .cloud:nth-of-type(5) { top: 32%; animation-duration: 44s; animation-delay: -18s; transform: scale(1.12); }
body > .cloud:nth-of-type(6) { top: 62%; animation-duration: 52s; animation-delay: -30s; transform: scale(0.78); }
body > .cloud:nth-of-type(7) { top: 76%; animation-duration: 58s; animation-delay: -10s; transform: scale(1.24); }

@keyframes cloudMove {
    from { translate: -10vw 0; }
    to { translate: calc(100vw + 360px) 0; }
}

.content {
    width: min(920px, calc(100vw - 40px));
    position: relative;
    z-index: 20;
    padding: clamp(26px, 5vw, 54px);
    text-align: center;
    background:
        linear-gradient(var(--panel), var(--panel)) padding-box,
        linear-gradient(135deg, rgba(232,79,155,0.8), rgba(29,159,215,0.78), rgba(79,154,53,0.72), rgba(139,92,246,0.8)) border-box;
    border: 4px solid transparent;
    border-radius: var(--radius);
    box-shadow: var(--pixel-shadow);
    backdrop-filter: blur(18px) saturate(1.2);
    animation: heroIn 0.8s cubic-bezier(.2,.85,.2,1) both;
}

.content::before,
.content::after {
    position: absolute;
    pointer-events: none;
}

.content::before {
    content: '❤ CFC Memory Block';
    top: -18px;
    left: 28px;
    padding: 8px 16px;
    border: 3px solid rgba(40, 50, 74, 0.16);

    background: #fff9ee;
    color: #e84f9b;

    background:
        linear-gradient(90deg, #7ec850 0 50%, #69ad3f 50%) 0 0 / 50% 28%,
        linear-gradient(90deg, #a06d3f 0 50%, #8b572f 50%) 0 28% / 50% 72%;
    background-repeat: repeat;
    border: 4px solid rgba(40, 50, 74, 0.18);
    border-radius: 18px;
    transform: rotate(8deg);
    box-shadow: 0 10px 0 rgba(0,0,0,0.08);
}

body.dark-mode .content::before {
    background: #2d294c;
    color: #ff9ed0;
    border-color: rgba(255,255,255,0.14);
}

@keyframes heroIn {
    from { opacity: 0; transform: translateY(-18px) scale(0.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

h1 {

}

body.dark-mode h1 {
    text-shadow: 0 5px 0 rgba(0,0,0,0.22), 0 14px 34px rgba(139,92,246,0.34);
}

@keyframes textPulse {

}

.hero-subtitle {
    position: relative;

}

.hero-subtitle::before {

body.dark-mode .hero-subtitle {

        linear-gradient(rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.08)) padding-box,
        linear-gradient(135deg, rgba(255, 122, 182, 0.46), rgba(57, 191, 240, 0.36), rgba(139, 92, 246, 0.42)) border-box;

.button-container {

    gap: 16px;
    margin-top: 28px;
    flex-wrap: wrap;
    justify-content: center;
}

.btn,
.docs-btn {
    position: relative;
    min-width: 166px;
    padding: 14px 22px;
    border: 3px solid rgba(40, 50, 74, 0.20);
    border-radius: 18px;

    font: inherit;
    font-size: 1.02rem;

.jump-btn { background: linear-gradient(135deg, #e84f9b, #8b5cf6); }

body.dark-mode .jump-btn { background: linear-gradient(135deg, #ff7ab6, #8b5cf6); }
body.dark-mode .join-btn { background: linear-gradient(135deg, #5fbf46, #1f8a55); }
body.dark-mode .docs-btn { background: linear-gradient(135deg, #39bff0, #5d77ff) !important; }

@keyframes btnFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
}

.btn::before,
.docs-btn::before {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 12px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
    transform: translateX(-80%);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.45s ease, opacity 0.2s ease;
}

.btn:hover,
.docs-btn:hover,
.btn:focus-visible,
.docs-btn:focus-visible {
    box-shadow: 0 7px 0 rgba(44, 38, 66, 0.20), 0 16px 28px rgba(44, 38, 66, 0.20);
    filter: saturate(1.08) brightness(1.05);
    animation: none;
    outline: none;
}

.btn:hover::before,
.docs-btn:hover::before {
    transform: translateX(80%);
    opacity: 1;
}

.btn:active,
.docs-btn:active {
    box-shadow: 0 5px 0 rgba(44, 38, 66, 0.22), 0 10px 18px rgba(44, 38, 66, 0.16);
    filter: brightness(0.98);
}

.tooltip {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    padding: 7px 11px;
    border: 2px solid rgba(255,255,255,0.75);
    border-radius: 12px;
    background: rgba(40, 50, 74, 0.88);
    color: white;
    font-size: 0.8rem;
    font-weight: 800;
    opacity: 0;
    transition: opacity 0.22s ease, transform 0.22s ease;
    white-space: nowrap;
    z-index: 10;
    pointer-events: none;
}

.btn:hover .tooltip,
.docs-btn:hover .tooltip,
.btn:focus-visible .tooltip,
.docs-btn:focus-visible .tooltip {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.theme-toggle {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 54px;
    height: 54px;
    border-radius: 18px;
    background: var(--panel-strong);
    backdrop-filter: blur(14px);
    border: 3px solid rgba(40, 50, 74, 0.14);
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    box-shadow: 0 7px 0 rgba(44, 38, 66, 0.14), 0 12px 28px var(--shadow);
}

.theme-toggle:hover,
.theme-toggle:focus-visible {
    transform: translateY(-3px) rotate(-4deg);
    outline: none;
}

.theme-toggle svg {
    width: 25px;
    height: 25px;
    fill: #e84f9b;
    transition: transform 0.3s ease, fill 0.3s ease;
}

body.dark-mode .theme-toggle svg {
    fill: #ffd166;
    transform: rotate(180deg);
}

.theme-tooltip {
    position: fixed;
    top: 84px;
    left: 20px;
    background: rgba(40, 50, 74, 0.88);
    color: white;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 0.8rem;
    font-weight: 800;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 1000;
    white-space: nowrap;
}

.theme-toggle:hover + .theme-tooltip {
    opacity: 1;
    transform: translateY(0);
}

.wiki-sidebar {
    position: fixed;
    top: 0;
    left: -320px;
    width: 320px;
    height: 100vh;
    background: var(--panel-strong);
    backdrop-filter: blur(18px) saturate(1.1);
    box-shadow: 12px 0 34px rgba(44, 38, 66, 0.18);
    transition: left 0.38s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 1001;

.wiki-sidebar.active { left: 0; }

.sidebar-toggle {
    position: fixed;
    top: 50%;
    left: 0;
    transform: translateY(-50%);
    width: 30px;
    height: 76px;
    background: var(--panel-strong);
    border: 3px solid rgba(40, 50, 74, 0.14);
    border-left: none;
    border-radius: 0 16px 16px 0;
    cursor: pointer;
    z-index: 901;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: width 0.25s ease, box-shadow 0.25s ease;
    box-shadow: 6px 8px 22px rgba(44, 38, 66, 0.14);

.sidebar-toggle:hover { width: 36px; }

.sidebar-toggle::after {
    content: '';
    width: 11px;
    height: 11px;
    border-right: 3px solid var(--ink);
    border-bottom: 3px solid var(--ink);

    transition: transform 0.25s ease;

.wiki-sidebar.active + .sidebar-toggle::after { transform: rotate(135deg); }

.wiki-sidebar h2 {
    margin-bottom: 22px;

.wiki-links {

body.dark-mode .wiki-link { background: rgba(255,255,255,0.08); }

.wiki-link::after {

body.dark-mode .wiki-link:hover { background: rgba(255,255,255,0.14); }

.footer {

    left: 50%;

.rain-effect {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    overflow: hidden;
}

.raindrop {
    position: absolute;
    width: 3px;
    height: 18px;
    background: linear-gradient(to bottom, transparent, rgba(85, 214, 255, 0.85));
    border-radius: 0 0 5px 5px;
    opacity: 0.65;
    animation: rainFall linear forwards;
    top: -20px;
}

@keyframes rainFall { to { transform: translateY(calc(100vh + 20px)); } }

.ripple {
    position: absolute;
    width: 10px;
    height: 10px;
    border: 2px solid rgba(85, 214, 255, 0.72);
    border-radius: 50%;
    opacity: 0;
    animation: rippleEffect 1.5s ease-out forwards;
    z-index: 9998;

@keyframes rippleEffect {

    100% { transform: scale(4); opacity: 0; }

.emoji-feedback {

    font-size: 25px;
    pointer-events: none;

    top: -10px;
    text-align: center;

.contributor-avatar:hover .contributor-tooltip {

.contributor-name { font-weight: 900; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.comments-section {

}

.comments-section.active { transform: translateY(0) scale(1); }

.comments-header {
    padding: 16px 18px;
    border-bottom: 3px dashed rgba(232,79,155,0.22);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 255, 255, 0.42);
}

body.dark-mode .comments-header { background: rgba(255,255,255,0.06); }

.comments-title {
    font-size: 1.16rem;
    font-weight: 900;
    color: var(--ink);
}

.comments-close {
    width: 34px;
    height: 34px;
    border: 2px solid rgba(40, 50, 74, 0.12);

.comments-close:hover { transform: rotate(8deg) scale(1.04); background: rgba(232,79,155,0.16); }
body.dark-mode .comments-close { background: rgba(255,255,255,0.08); }

.comments-container {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
}

.comments-toggle {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 62px;
    height: 62px;
    border-radius: 20px;
    background: linear-gradient(135deg, #e84f9b, #8b5cf6);

    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    transition: transform 0.24s ease, box-shadow 0.24s ease;
    box-shadow: 0 8px 0 rgba(44, 38, 66, 0.20), 0 14px 28px rgba(44, 38, 66, 0.22);
    animation: btnFloat 3.2s infinite ease-in-out;
}

.comments-toggle:hover,
.comments-toggle:focus-visible {
    transform: translateY(-4px) rotate(3deg);
    animation: none;
    outline: none;
}

.comments-toggle svg { width: 26px; height: 26px; fill: white; }

.stats-dock {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%) translateY(-26px) scale(0.96);
    opacity: 0;
    pointer-events: none;
    color: var(--ink);
    padding: 10px 14px;

            <script>
        // 访问统计功能
        async function updateVisitStats() {
            try {
                console.log('📊 开始更新访问统计');

                // 更新问候语
                const greetingText = document.getElementById('greetingText');
                if (greetingText) {
                    greetingText.textContent = getGreeting();
                }

                // 获取统计数据
                await fetchAndDisplayRealStats();

            } catch (error) {
                console.error('更新访问统计失败:', error);
            } finally {
                // 无论成功失败，都显示统计面板
                console.log('📊 统计更新完成，显示面板');
                showStatsPanel();
            }
        }

        // 获取并显示真实统计数据
        async function fetchAndDisplayRealStats() {
            try {
                const url = 'https://colorfulcraft.github.io/CFCHistory/stats/visit_stats.json?t=' + Date.now();
                const statsResponse = await fetch(url);

                if (statsResponse.ok) {
                    const content = await statsResponse.json();

                    // 计算今日访问量
                    const today = new Date().toISOString().split('T')[0];
                    let todayVisits = 0;

                    if (content.hourly_visits) {
                        Object.entries(content.hourly_visits).forEach(([hourKey, count]) => {
                            if (hourKey.startsWith(today)) {
                                todayVisits += count;
                            }
                        });
                    }

                    // 更新显示（即使数据为0也更新）
                    updateStatsDisplay(todayVisits, content.total_visits || 0);
                }
            } catch (error) {
                // 静默失败，显示默认值
                updateStatsDisplay(0, 0);
            }
        }

        // 更新统计显示
        function updateStatsDisplay(todayCount, totalCount) {
            const todayCountElement = document.getElementById('todayCount');
            const totalCountElement = document.getElementById('totalCount');

            if (todayCountElement) {
                todayCountElement.textContent = todayCount.toString();
            }
            if (totalCountElement) {
                totalCountElement.textContent = totalCount.toString();
            }
        }

        // 获取问候语
        function getGreeting() {
            const hour = new Date().getHours();
            if (hour >= 5 && hour < 12) {
                return '早上好';
            } else if (hour >= 12 && hour < 14) {
                return '中午好';
            } else if (hour >= 14 && hour < 18) {
                return '下午好';
            } else if (hour >= 18 && hour < 22) {
                return '晚上好';
            } else {
                return '夜深了';
            }
        }

        // 头像掉落动画
        function dropAvatar(avatar) {
            const gravity = 0.2;
            const bounceFactor = 0.7;
            const friction = 0.99;

            let y = -60;
            let velocityY = 0;
            let velocityX = (Math.random() - 0.5) * 2; // 随机水平速度

            function animate() {
                velocityY += gravity;
                y += velocityY;

                // 水平移动
                let x = parseFloat(avatar.style.left) + velocityX;

                // 边界检测（左右边界）
                if (x < 0) {
                    x = 0;
                    velocityX = -velocityX * bounceFactor;
                } else if (x > window.innerWidth - 50) {
                    x = window.innerWidth - 50;
                    velocityX = -velocityX * bounceFactor;
                }

                // 底部边界检测
                if (y > window.innerHeight - 50) {
                    y = window.innerHeight - 50;
                    velocityY = -velocityY * bounceFactor;

                    // 添加摩擦力
                    velocityX *= friction;

                    // 如果速度很小，停止动画
                    if (Math.abs(velocityY) < 0.5 && Math.abs(velocityX) < 0.2) {
                        return;
                    }
                }

                avatar.style.top = `${y}px`;
                avatar.style.left = `${x}px`;

                requestAnimationFrame(animate);
            }

            animate();
        }

            script.setAttribute('repo', 'ColorFulCraft/CFCHistory');
            script.setAttribute('issue-term', '💬 CFCHistory - 评论专区');
            script.setAttribute('label', 'comments');
            script.setAttribute('theme', body.classList.contains('dark-mode') ? 'github-dark' : 'github-light');
            script.setAttribute('crossorigin', 'anonymous');
            script.async = true;

            let utterancesLoaded = false;
            let successDetected = false;

            script.onload = function() {
                debugLog('Utterances脚本加载成功');
                utterancesLoaded = true;

                // 更智能的成功检测
                checkUtterancesSuccess();
            };

            script.onerror = function(error) {
                debugLog('Utterances脚本加载失败:', error);
                showErrorMessage('评论系统加载失败，请检查控制台获取详细信息');
            };

            commentsContainer.appendChild(script);

            // 改进的成功检测逻辑
            function checkUtterancesSuccess() {
                const iframe = commentsContainer.querySelector('iframe');

                if (!iframe) {
                    debugLog('未找到Utterances iframe，稍后重试');
                    // 如果iframe还没创建，稍后重试
                    if (!successDetected) {
                        setTimeout(checkUtterancesSuccess, 500);
                    }
                    return;
                }

                debugLog('找到Utterances iframe');

                // 监听iframe加载完成
                iframe.addEventListener('load', function() {
                    debugLog('Utterances iframe加载完成');
                    successDetected = true;
                    removeLoadingMessage();
                });

                // 备用检测：通过观察iframe尺寸和内容
                const checkContent = setInterval(() => {
                    if (successDetected) {
                        clearInterval(checkContent);
                        return;
                    }

                    // 如果iframe有实际高度，说明内容加载成功
                    if (iframe.offsetHeight > 100) {
                        debugLog('通过尺寸判断评论系统加载成功');
                        successDetected = true;
                        removeLoadingMessage();
                        clearInterval(checkContent);
                    }
                }, 500);

                // 8秒后超时处理
                setTimeout(() => {
                    if (!successDetected && !utterancesLoaded) {
                        debugLog('评论系统加载超时');
                        showErrorMessage('评论系统加载超时，请刷新页面重试');
                    } else if (!successDetected && utterancesLoaded) {
                        // 脚本加载成功但内容可能还在加载，给更多时间
                        debugLog('脚本已加载，但内容仍在初始化，延长等待时间');
                        setTimeout(() => {
                            if (!successDetected) {
                                showErrorMessage('评论系统初始化较慢，请耐心等待或刷新页面');
                            }
                        }, 5000);
                    }
                }, 8000);
            }

            // 移除加载消息
            function removeLoadingMessage() {
                if (loadingMsg && loadingMsg.parentNode) {
                    loadingMsg.remove();
                    debugLog('加载消息已移除，评论系统显示正常');
                }
            }
        }

        // 显示错误信息
        function showErrorMessage(message) {
            const existingMsg = commentsContainer.querySelector('div');
            if (existingMsg && !existingMsg.querySelector('iframe')) {
                existingMsg.innerHTML = `
                    <div style="color: #ff6b6b; margin-bottom: 10px;">❌ ${message}</div>
                    <div style="font-size: 0.8rem; margin-bottom: 15px;">
                        请检查：<br>
                        1. GitHub仓库是公开的<br>
                        2. Utterances应用已安装<br>
                        3. 存在带有"comments"标签的Issue
                    </div>
                    <button onclick="initUtterances()"
                            style="padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 5px;">
                        重新加载
                    </button>
                    <button onclick="location.reload()"
                            style="padding: 8px 16px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 5px;">
                        刷新页面
                    </button>
                `;
            }
        }

        // 切换评论区域显示/隐藏
        commentsToggle.addEventListener('click', async () => {
            commentsSection.classList.toggle('active');
            if (commentsSection.classList.contains('active') && commentsContainer.children.length === 0) {
                await initUtterances();
            }
        });

        // 关闭评论区域
        commentsClose.addEventListener('click', () => {
            commentsSection.classList.remove('active');
        });

        // 点击评论区域外部关闭
        document.addEventListener('click', (e) => {
            if (commentsSection.classList.contains('active') &&
                !commentsSection.contains(e.target) &&
                !commentsToggle.contains(e.target)) {
                commentsSection.classList.remove('active');
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            console.log('🏠 页面加载完成');

            // 先显示免责声明
            showDisclaimer();

            // 立即更新问候语
            const greetingText = document.getElementById('greetingText');
            if (greetingText) {
                greetingText.textContent = getGreeting();
            }

            // 设置统计面板事件监听
            setupStatsPanel();

            // 初始化其他功能
            renderWikiLinks();
            createRainEffect();
            fetchGitHubStars();
            fetchContributors();

            // 添加点击事件监听器
            document.addEventListener('click', createEmojiFeedback);
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                createEmojiFeedback(e);
            });

            // 禁止文本选择和复制
            document.addEventListener('selectstart', function(e) {
                e.preventDefault();
            });

            document.addEventListener('copy', function(e) {
                e.preventDefault();
            });

            // 如果用户已经同意，开始动画和统计
            if (localStorage.getItem('disclaimerAccepted') === 'true') {
                console.log('✅ 用户已同意免责声明，显示统计面板');
                startPageAnimations();
                updateVisitStats();
            } else {
                console.log('⏳ 等待用户同意免责声明');
                // 等待免责声明处理完成
                const checkDisclaimer = setInterval(() => {
                    const disclaimerOverlay = document.querySelector('div[style*="z-index: 10000"]');
                    if (!disclaimerOverlay || localStorage.getItem('disclaimerAccepted') === 'true') {
                        clearInterval(checkDisclaimer);
                        console.log('✅ 用户同意免责声明完成，显示统计面板');
                        startPageAnimations();
                        updateVisitStats();
                    }
                }, 100);
            }
        });

            </script>
        </body>

        </html>

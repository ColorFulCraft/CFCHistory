<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fafafa">
  <title>ColorFulCraft | 技术文档中心</title>

  <link rel="icon" href="pictures/favicon.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --surface-2: #f5f5f5;
      --text: #0a0a0a;
      --text-secondary: #737373;
      --text-tertiary: #a3a3a3;
      --border: #e5e5e5;
      --border-strong: #d4d4d4;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-soft: rgba(99, 102, 241, .08);
      --code-bg: #f5f5f5;
      --radius-sm: 8px;
      --radius: 10px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
      --shadow-md: 0 4px 16px rgba(0,0,0,.08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --transition: .2s cubic-bezier(.4,0,.2,1);
      --sidebar-w: 280px;
      --theme-color: var(--accent);
      --sidebar-width: var(--sidebar-w);
    }

    body.dark-mode {
      --bg: #0a0a0a;
      --surface: #151515;
      --surface-2: #1f1f1f;
      --text: #fafafa;
      --text-secondary: #a3a3a3;
      --text-tertiary: #737373;
      --border: #262626;
      --border-strong: #404040;
      --accent: #818cf8;
      --accent-hover: #a5b4fc;
      --accent-soft: rgba(129, 140, 248, .12);
      --code-bg: #1f1f1f;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
      --shadow-md: 0 4px 16px rgba(0,0,0,.5);
    }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color var(--transition), color var(--transition);
    }

    /* ============ 加载态 ============ */
    #app {
      min-height: 100vh;
      position: relative;
    }

    #app:empty,
    #app:has(> :not(.sidebar):not(.content):not(.sidebar-toggle)) {
      /* 占位 */
    }

    /* ============ 主题切换 ============ */
    .theme-toggle-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      z-index: 1000;
      transition: all var(--transition);
      box-shadow: var(--shadow-sm);
    }

    .theme-toggle-btn:hover {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border-strong);
    }

    .theme-toggle-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .theme-toggle-btn svg { width: 18px; height: 18px; }
    .icon-moon { display: none; }
    body.dark-mode .icon-sun { display: none; }
    body.dark-mode .icon-moon { display: block; }

    /* ============ 侧边栏 ============ */
    .sidebar {
      background: var(--surface) !important;
      border-right: 1px solid var(--border) !important;
      color: var(--text) !important;
      padding: 24px 16px !important;
      width: var(--sidebar-w) !important;
      transition: background-color var(--transition), border-color var(--transition);
    }

    .app-name {
      display: flex !important;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px !important;
      padding: 0 8px !important;
      font-size: .95rem !important;
      font-weight: 600 !important;
      letter-spacing: -.01em;
      color: var(--text) !important;
    }

    .app-name::before {
      content: '';
      flex-shrink: 0;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e84f9b, #8b5cf6, #1d9fd7);
    }

    .app-name-link { color: var(--text) !important; }

    .sidebar ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .sidebar-nav,
    .sidebar ul li a {
      font-family: var(--font) !important;
      font-size: .875rem !important;
      font-weight: 400 !important;
      color: var(--text-secondary) !important;
      border-radius: var(--radius-sm) !important;
      padding: 7px 10px !important;
      transition: background-color var(--transition), color var(--transition) !important;
    }

    .sidebar-nav ul li a {
      display: block;
      text-decoration: none;
    }

    .sidebar-nav ul li a:hover {
      background: var(--surface-2) !important;
      color: var(--text) !important;
      transform: none !important;
    }

    .sidebar-nav ul li.active > a {
      background: var(--accent-soft) !important;
      color: var(--accent) !important;
      font-weight: 500 !important;
    }

    .sidebar-nav p {
      color: var(--text-tertiary) !important;
      font-weight: 500 !important;
      font-size: .75rem !important;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin: 18px 0 6px !important;
      padding: 0 10px !important;
    }

    /* 侧边栏开关 */
    .sidebar-toggle {
      background: var(--surface) !important;
      border: 1px solid var(--border) !important;
      border-left: none !important;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0 !important;
      box-shadow: var(--shadow-sm) !important;
      padding: 0 !important;
      width: 26px !important;
    }

    .sidebar-toggle:hover { background: var(--surface-2) !important; }

    .sidebar-toggle span {
      background-color: var(--text-tertiary) !important;
      height: 2px !important;
      width: 14px !important;
      border-radius: 2px;
    }

    .sidebar-toggle span:nth-child(2) { width: 14px !important; }

    /* ============ 搜索 ============ */
    .search {
      margin-bottom: 16px !important;
      border-bottom: none !important;
      padding: 0 8px 16px !important;
    }

    .search input {
      width: 100%;
      padding: 8px 12px !important;
      font-family: var(--font) !important;
      font-size: .85rem !important;
      font-weight: 400 !important;
      color: var(--text) !important;
      background: var(--surface-2) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius-sm) !important;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition) !important;
    }

    .search input::placeholder { color: var(--text-tertiary) !important; }

    .search input:focus {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 3px var(--accent-soft) !important;
    }

    .search .results-panel {
      background: var(--surface) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius) !important;
      color: var(--text) !important;
      box-shadow: var(--shadow-md) !important;
      overflow: hidden !important;
    }

    .search .matching-post {
      border-bottom: 1px solid var(--border) !important;
      padding: 10px 14px !important;
    }

    .search .matching-post a {
      color: var(--text) !important;
      font-weight: 400 !important;
      text-decoration: none !important;
    }

    .search .matching-post a:hover {
      color: var(--accent) !important;
      background: transparent !important;
    }

    .search .matching-post p { color: var(--text-secondary) !important; font-size: .8rem !important; }
    .search .search-keyword { color: var(--accent) !important; }

    /* ============ 内容区 ============ */
    .content {
      background: transparent !important;
    }

    @media (min-width: 769px) {
      .content { left: var(--sidebar-w) !important; }
      body.close .content { left: 0 !important; }
    }

    .markdown-section {
      max-width: 900px !important;
      margin: 48px auto 72px !important;
      padding: 48px 44px !important;
      color: var(--text) !important;
      background: var(--surface) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius-lg) !important;
      box-shadow: var(--shadow-sm) !important;
      font-size: 15px !important;
      line-height: 1.75 !important;
      transition: background-color var(--transition), border-color var(--transition);
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4,
    .markdown-section h5,
    .markdown-section h6 {
      color: var(--text) !important;
      font-weight: 600 !important;
      letter-spacing: -.02em;
      line-height: 1.3 !important;
    }

    .markdown-section h1 {
      font-size: 1.9rem !important;
      margin: 0 0 1.2em !important;
      padding-bottom: .6em !important;
      border-bottom: 1px solid var(--border) !important;
    }

    .markdown-section h2 {
      font-size: 1.35rem !important;
      margin: 2.2em 0 .8em !important;
      padding-bottom: .4em !important;
      border-bottom: 1px solid var(--border) !important;
    }

    .markdown-section h3 { font-size: 1.12rem !important; margin: 1.8em 0 .6em !important; }
    .markdown-section h4 { font-size: 1rem !important; margin: 1.5em 0 .5em !important; }

    .markdown-section h1 a,
    .markdown-section h2 a,
    .markdown-section h3 a { color: inherit !important; text-decoration: none !important; }

    .markdown-section p,
    .markdown-section li,
    .markdown-section td,
    .markdown-section th,
    .markdown-section blockquote {
      color: var(--text) !important;
    }

    .markdown-section p { margin-bottom: 1em !important; }

    .markdown-section a {
      color: var(--accent) !important;
      font-weight: 400 !important;
      text-decoration: none !important;
      border-bottom: 1px solid transparent;
      transition: color var(--transition), border-color var(--transition) !important;
    }

    .markdown-section a:hover {
      color: var(--accent-hover) !important;
      text-decoration: none !important;
      border-color: var(--accent-hover);
    }

    /* 行内代码 */
    .markdown-section code {
      background: var(--code-bg) !important;
      color: var(--text) !important;
      padding: 2px 6px !important;
      border: 1px solid var(--border) !important;
      border-radius: 5px !important;
      font-size: .86em !important;
      font-weight: 400 !important;
      font-family: "SF Mono", "JetBrains Mono", "Fira Code", Consolas, monospace !important;
    }

    /* 代码块 */
    .markdown-section pre {
      background: var(--code-bg) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius) !important;
      padding: 16px 18px !important;
      margin: 1.2em 0 !important;
      box-shadow: none !important;
      overflow-x: auto;
    }

    .markdown-section pre code {
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      color: var(--text) !important;
      font-size: .85rem !important;
      line-height: 1.7 !important;
    }

    .markdown-section pre::after {
      color: var(--text-tertiary) !important;
      font-size: .7rem !important;
    }

    /* 引用 */
    .markdown-section blockquote {
      margin: 1.2em 0 !important;
      padding: 12px 18px !important;
      background: var(--surface-2) !important;
      border-left: 2px solid var(--accent) !important;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0 !important;
      color: var(--text-secondary) !important;
    }

    .markdown-section blockquote p { margin-bottom: 0 !important; color: var(--text-secondary) !important; }

    /* 表格 */
    .markdown-section table {
      display: table !important;
      width: 100% !important;
      border-collapse: collapse !important;
      border-spacing: 0 !important;
      margin: 1.2em 0 !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius-sm) !important;
      overflow: hidden !important;
      font-size: .9rem !important;
    }

    .markdown-section table th {
      background: var(--surface-2) !important;
      color: var(--text) !important;
      font-weight: 600 !important;
      text-align: left;
      padding: 10px 14px !important;
      border-bottom: 1px solid var(--border) !important;
      border-right: 1px solid var(--border) !important;
    }

    .markdown-section table td {
      padding: 10px 14px !important;
      border-bottom: 1px solid var(--border) !important;
      border-right: 1px solid var(--border) !important;
    }

    .markdown-section table tr:last-child td { border-bottom: none !important; }
    .markdown-section table th:last-child,
    .markdown-section table td:last-child { border-right: none !important; }

    .markdown-section table tr:hover td { background: var(--surface-2) !important; }

    /* 图片 */
    .markdown-section img {
      max-width: 100% !important;
      border-radius: var(--radius-sm) !important;
      border: 1px solid var(--border) !important;
      box-shadow: var(--shadow-sm) !important;
    }

    /* 分割线 */
    .markdown-section hr {
      border: none !important;
      border-top: 1px solid var(--border) !important;
      margin: 2em 0 !important;
    }

    /* 列表 */
    .markdown-section ul,
    .markdown-section ol { padding-left: 1.4em !important; margin-bottom: 1em !important; }
    .markdown-section li { margin-bottom: .35em !important; }

    /* 锚点 */
    .anchor { color: var(--text-tertiary) !important; }
    .anchor:hover { color: var(--accent) !important; }

    /* ============ 复制按钮 ============ */
    .docsify-copy-code-button {
      background: var(--text) !important;
      color: var(--bg) !important;
      border-radius: var(--radius-sm) !important;
      font-size: .72rem !important;
      font-family: var(--font) !important;
      padding: 4px 10px !important;
      border: none !important;
      opacity: .8;
    }

    .docsify-copy-code-button:hover { opacity: 1; }

    /* ============ 图片放大 ============ */
    .medium-zoom-overlay,
    .medium-zoom-image--opened {
      background: rgba(10, 10, 10, .92) !important;
      z-index: 9999 !important;
    }

    /* ============ 滚动条 ============ */
    .sidebar::-webkit-scrollbar,
    .content::-webkit-scrollbar,
    .markdown-section pre::-webkit-scrollbar { width: 7px; height: 7px; }

    .sidebar::-webkit-scrollbar-track,
    .content::-webkit-scrollbar-track,
    .markdown-section pre::-webkit-scrollbar-track { background: transparent; }

    .sidebar::-webkit-scrollbar-thumb,
    .content::-webkit-scrollbar-thumb,
    .markdown-section pre::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 999px;
    }

    .sidebar::-webkit-scrollbar-thumb:hover,
    .content::-webkit-scrollbar-thumb:hover,
    .markdown-section pre::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

    /* ============ 响应式 ============ */
    @media (max-width: 768px) {
      .theme-toggle-btn {
        top: 14px;
        right: 14px;
        width: 36px;
        height: 36px;
      }

      .markdown-section {
        margin: 24px 16px 48px !important;
        padding: 28px 20px !important;
        border-radius: var(--radius) !important;
        font-size: 14.5px !important;
      }

      .markdown-section h1 { font-size: 1.55rem !important; }
      .markdown-section h2 { font-size: 1.2rem !important; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <!-- 主题按钮 -->
  <button class="theme-toggle-btn" id="themeToggle" aria-label="切换深色模式" title="切换主题">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <div id="app">正在加载文档系统…</div>

  <script>
    /* ============================================================
       主题同步（与主页共用 localStorage 键）
       ============================================================ */
    const THEME_KEY = 'theme';
    const DOCS_THEME_KEY = 'cfc-docs-theme';
    const SYNC_KEY = 'cfc-theme-sync';
    const DOCS_UPDATE_KEY = 'docs-theme-update';
    const DEFAULT_THEME = 'dark';

    function setTheme(theme, persist = true) {
      const isDark = theme === 'dark';
      document.body.classList.toggle('dark-mode', isDark);

      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', isDark ? '#0a0a0a' : '#fafafa');

      if (persist) {
        localStorage.setItem(THEME_KEY, theme);
        localStorage.setItem(DOCS_THEME_KEY, theme);
      }
    }

    function syncThemeFromHomePage() {
      try {
        const urlTheme = new URLSearchParams(window.location.search).get('theme');

        let syncTheme = null;
        try {
          const raw = localStorage.getItem(SYNC_KEY);
          if (raw) syncTheme = JSON.parse(raw).theme || null;
        } catch (e) { /* ignore */ }

        const stored = localStorage.getItem(THEME_KEY);
        const theme = urlTheme || syncTheme || stored || DEFAULT_THEME;

        setTheme(theme);

        // 回写，确保主页与文档页状态一致
        localStorage.setItem(SYNC_KEY, JSON.stringify({
          type: 'theme-change',
          theme: theme,
          timestamp: Date.now(),
          source: 'documentation-page'
        }));
      } catch (e) {
        console.warn('主题同步失败:', e);
        setTheme(DEFAULT_THEME);
      }
    }

    function toggleTheme() {
      const isDark = document.body.classList.contains('dark-mode');
      const next = isDark ? 'light' : 'dark';
      setTheme(next);

      const evt = {
        type: 'theme-change',
        theme: next,
        timestamp: Date.now(),
        source: 'documentation-toggle'
      };

      localStorage.setItem(DOCS_UPDATE_KEY, JSON.stringify(evt));
      localStorage.setItem(SYNC_KEY, JSON.stringify(evt));

      try {
        window.dispatchEvent(new StorageEvent('storage', {
          key: DOCS_UPDATE_KEY,
          newValue: JSON.stringify(evt)
        }));
      } catch (e) { /* ignore */ }

      setTimeout(() => localStorage.removeItem(DOCS_UPDATE_KEY), 3000);
    }

    /* ============================================================
       docsify 配置
       ============================================================ */
    window.$docsify = {
      name: 'ColorFulCraft 技术文档中心',
      repo: 'ColorFulCraft/CFCHistory',

      basePath: './docs/',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/docs/(.*)': '/$1',
        '/docs/history/(.*)': '/history/$1',
        '/history/(.*)': '/history/$1',
        '/': '/README.md',
        '': '/README.md'
      },

      search: {
        paths: 'auto',
        placeholder: '搜索文档…',
        noData: '没有找到相关结果',
        depth: 3,
        namespace: 'cfc-docs',
        hideOtherSidebarContent: false
      },

      sidebarDisplayLevel: 2,
      loadNavbar: false,
      coverpage: false,
      notFoundPage: '404.md',

      plugins: [
        function (hook, vm) {
          hook.init(function () {
            syncThemeFromHomePage();
          });

          hook.beforeEach(function (content, next) {
            const file = (vm.route.file || 'README.md').replace(/^\/?docs\//, '');
            const editUrl = `https://github.com/ColorFulCraft/CFCHistory/blob/main/docs/${file}`;

            content += '\n\n---\n\n' +
              '> **文档信息** | 最后更新：' + new Date().toLocaleDateString('zh-CN') +
              ' | [在 GitHub 上编辑此页](' + editUrl + ')\n';

            next(content);
          });

          hook.mounted(function () {
            // 主题按钮的点击绑定在 DOMContentLoaded 中统一处理，避免重复绑定
          });

          hook.doneEach(function () {
            // 图片主题适配
            document.querySelectorAll('.markdown-section img').forEach(img => {
              img.style.maxWidth = '100%';
            });

            // 外链标识
            document.querySelectorAll('.markdown-section a[href^="http"]').forEach(link => {
              if (!link.href.includes(window.location.hostname)) {
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                if (!link.querySelector('.external-icon')) {
                  const icon = document.createElement('span');
                  icon.className = 'external-icon';
                  icon.textContent = ' ↗';
                  icon.style.fontSize = '.8em';
                  icon.style.opacity = '.7';
                  link.appendChild(icon);
                }
              }
            });

            // 404 兜底
            setTimeout(() => {
              const section = document.querySelector('.markdown-section');
              if (section && section.textContent.includes('找不到该页面')) {
                console.log('检测到 404 页面');
              }
            }, 500);
          });
        }
      ]
    };

    /* ============================================================
       页面初始化
       ============================================================ */
    document.addEventListener('DOMContentLoaded', function () {
      syncThemeFromHomePage();

      const themeToggle = document.getElementById('themeToggle');
      if (themeToggle) {
        themeToggle.addEventListener('click', toggleTheme);
      }

      // 监听主页主题变化
      window.addEventListener('storage', function (e) {
        if (e.key === SYNC_KEY) {
          try {
            const data = JSON.parse(e.newValue);
            if (data && data.theme && data.source !== 'documentation-page') {
              setTheme(data.theme);
            }
          } catch (err) {
            console.warn('主题同步解析错误:', err);
          }
        }
      });

      // 空哈希时回到首页
      setTimeout(() => {
        if (!location.hash || location.hash === '#') {
          location.hash = '#/README.md';
        }
      }, 100);

      window.addEventListener('hashchange', function () {
        // 便于调试保留
      });
    });
  </script>
